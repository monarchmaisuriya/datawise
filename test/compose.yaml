# Test databases for scripts/conformance.ts. Own project name and own ports, so nothing here can reach
# another project's containers. Heavy engines have profiles: start them one at a time.
name: datawise-test
services:
  postgres:
    image: postgres:17-alpine
    mem_limit: 512m
    environment: { POSTGRES_PASSWORD: dw-test-pass, POSTGRES_USER: dw, POSTGRES_DB: dw }
    ports: ["127.0.0.1:25432:5432"]
  mysql:
    image: mysql:8.4
    mem_limit: 1g
    environment: { MYSQL_ROOT_PASSWORD: dw-test-pass, MYSQL_DATABASE: dw }
    ports: ["127.0.0.1:23306:3306"]
  mariadb:
    image: mariadb:11
    mem_limit: 512m
    environment: { MARIADB_ROOT_PASSWORD: dw-test-pass, MARIADB_DATABASE: dw }
    ports: ["127.0.0.1:23307:3306"]
  redis:
    image: redis:7-alpine
    mem_limit: 128m
    command: ["redis-server", "--requirepass", "dw-test-pass"]
    ports: ["127.0.0.1:26379:6379"]
  mongodb:
    image: mongo:8
    mem_limit: 1g
    environment: { MONGO_INITDB_ROOT_USERNAME: dw, MONGO_INITDB_ROOT_PASSWORD: dw-test-pass }
    ports: ["127.0.0.1:27018:27017"]
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    mem_limit: 1g
    environment: { CLICKHOUSE_USER: dw, CLICKHOUSE_PASSWORD: dw-test-pass, CLICKHOUSE_DB: dw, CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1" }
    ports: ["127.0.0.1:28123:8123"]
  dynamodb:
    image: amazon/dynamodb-local:latest
    mem_limit: 512m
    ports: ["127.0.0.1:28000:8000"]
  ssh:
    image: lscr.io/linuxserver/openssh-server:latest
    mem_limit: 128m
    environment: { PASSWORD_ACCESS: "true", USER_NAME: dw, USER_PASSWORD: dw-test-pass, DOCKER_MODS: "linuxserver/mods:openssh-server-ssh-tunnel" }
    ports: ["127.0.0.1:22222:2222"]
  elasticsearch:
    profiles: [heavy]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.3
    mem_limit: 1500m
    environment: { discovery.type: single-node, ES_JAVA_OPTS: -Xms512m -Xmx512m, xpack.security.enabled: "true", ELASTIC_PASSWORD: dw-test-pass, xpack.security.http.ssl.enabled: "false" }
    ports: ["127.0.0.1:29200:9200"]
  opensearch:
    profiles: [heavy]
    image: opensearchproject/opensearch:2
    mem_limit: 1500m
    environment: { discovery.type: single-node, OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m, DISABLE_SECURITY_PLUGIN: "true", DISABLE_INSTALL_DEMO_CONFIG: "true" }
    ports: ["127.0.0.1:29201:9200"]
  cassandra:
    profiles: [heavy]
    image: cassandra:5
    mem_limit: 2g
    environment: { MAX_HEAP_SIZE: 768M, HEAP_NEWSIZE: 200M, CASSANDRA_DC: datacenter1 }
    ports: ["127.0.0.1:29042:9042"]
  neo4j:
    profiles: [heavy]
    image: neo4j:5-community
    mem_limit: 1500m
    environment: { NEO4J_AUTH: neo4j/dw-test-pass, NEO4J_server_memory_heap_max__size: 512m }
    ports: ["127.0.0.1:27687:7687"]
  mssql:
    profiles: [heavy]
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    mem_limit: 2500m
    environment: { ACCEPT_EULA: "Y", MSSQL_SA_PASSWORD: Dw-test-pass1, MSSQL_MEMORY_LIMIT_MB: "1500" }
    ports: ["127.0.0.1:21433:1433"]
  oracle:
    profiles: [heavy]
    image: gvenzl/oracle-free:23-slim
    mem_limit: 2500m
    environment: { ORACLE_PASSWORD: dw-test-pass, APP_USER: dw, APP_USER_PASSWORD: dw-test-pass }
    ports: ["127.0.0.1:21521:1521"]
